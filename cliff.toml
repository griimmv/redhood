[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n"
body = """
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}[breaking] {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
trim = true
postprocessors = [{ pattern = "Miscellaneous Chores", replace = "Housekeeping" }]

[git]
conventional_commits = true
filter_unconventional = false
commit_preprocessors = [
  { pattern = '\((\w+\s?)\)', replace = "" },
  { pattern = '^(\w*)(\w)(.*)', replace = "{{lower|default(text=\"$1\")}}$2$3" },
]

[git.conventional_commits]
types = [
  { type = "feat", group = "Features", description = "New features" },
  { type = "fix", group = "Bug Fixes", description = "Bug fixes" },
  { type = "docs", group = "Documentation", description = "Documentation changes" },
  { type = "refactor", group = "Refactoring", description = "Code restructuring" },
  { type = "perf", group = "Performance", description = "Performance improvements" },
  { type = "test", group = "Testing", description = "Test additions or changes" },
  { type = "chore", group = "Housekeeping", description = "Build process or tooling changes" },
  { type = "style", group = "Styling", description = "Code style changes" },
]
