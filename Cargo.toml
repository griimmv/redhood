[package]
name = "redhood"
version = "0.1.0"
edition = "2024"

[dependencies]
teloxide = { version = "0.17", features = ["macros", "webhooks", "webhooks-axum"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "blocking", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
dotenvy = "0.15"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio-cron-scheduler = "0.15"
tower-http = { version = "0.7", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
anyhow = "1"
base64 = "0.22"
url = "2"
hmac = "0.12"
sha1 = "0.10"
rand = "0.8"
