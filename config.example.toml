[telegram]
bot_token = "YOUR_BOT_TOKEN"
owner_chat_id = 123456789

# Optional — comment out this entire section to disable Reddit polling
[reddit]
client_id = "YOUR_CLIENT_ID"
client_secret = "YOUR_CLIENT_SECRET"
username = "YOUR_REDDIT_USERNAME"
password = "YOUR_REDDIT_PASSWORD"
poll_interval_secs = 60

# Optional — comment out this entire section to disable Twitter polling
[twitter]
api_key = "YOUR_API_KEY"
api_secret_key = "YOUR_API_SECRET"
access_token = "YOUR_ACCESS_TOKEN"
access_token_secret = "YOUR_ACCESS_TOKEN_SECRET"
user_id = "YOUR_USER_ID"
poll_interval_secs = 60

[database]
path = "redhood.db"

# Optional — comment out or remove this entire section to disable the /video command
[video]
base_dir = "/path/to/your/videos"

[webhook]
host = "0.0.0.0"
port = 8080
public_url = "https://your-ngrok-url.ngrok.io"
